[package]
name = "workbench-wasm"
version = "0.1.0"
edition = "2021"
description = "The app's backend as WebAssembly, for the web build: the same code as the desktop commands, reading the game's files through the page"

[lib]
crate-type = ["cdylib"]

[dependencies]
workbench-core = { path = "../workbench-core" }
source-formats = { path = "../source-formats" }
serde_json = "1"
