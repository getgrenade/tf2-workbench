[package]
name = "tf2-workbench"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
source-formats = { path = "../crates/source-formats" }
workbench-core = { path = "../crates/workbench-core" }
